<!-- SEARCH ENGINE JAVASCRIPT -->
<script>
document.addEventListener("DOMContentLoaded", () => {
    const searchInput = document.getElementById("dbSearch");
    const catFilter = document.getElementById("dbCategoryFilter");
    const typeFilter = document.getElementById("dbTypeFilter");
    const items = document.querySelectorAll(".db-item");
    const categories = document.querySelectorAll(".db-category-block");

    function filterDatabase() {
        const query = searchInput.value.toLowerCase();
        const selectedCat = catFilter.value;
        const selectedType = typeFilter.value;

        items.forEach(item => {
            const text = item.innerText.toLowerCase();
            const tags = (item.getAttribute("data-tags") || "").toLowerCase();
            const type = item.getAttribute("data-type");
            const cat = item.getAttribute("data-category");

            const matchesSearch = text.includes(query) || tags.includes(query);
            const matchesCat = (selectedCat === "all" || cat === selectedCat);
            const matchesType = (selectedType === "all" || type === selectedType);

            if (matchesSearch && matchesCat && matchesType) {
                item.style.display = "block";
            } else {
                item.style.display = "none";
            }
        });

        // Hide empty category titles
        categories.forEach(block => {
            let hasVisibleItems = false;
            block.querySelectorAll(".db-item").forEach(i => {
                if (i.style.display !== "none") hasVisibleItems = true;
            });
            block.style.display = hasVisibleItems ? "block" : "none";
        });
    }

    searchInput.addEventListener("input", filterDatabase);
    catFilter.addEventListener("change", filterDatabase);
    typeFilter.addEventListener("change", filterDatabase);
});
</script>
