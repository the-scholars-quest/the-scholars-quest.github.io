<!-- SIMPLE SEARCH JAVASCRIPT -->
  <script>
  document.addEventListener("DOMContentLoaded", () => {
      const searchInput = document.getElementById("simpleSearch");
      if(!searchInput) return;
      
      searchInput.addEventListener("input", (e) => {
          const queryTerms = e.target.value.toLowerCase().split(/\s+/).filter(t => t.length > 0);
          const items = document.querySelectorAll("#mediaList p");
          
          items.forEach(item => {
              const text = item.innerText.toLowerCase();
              // Checks if EVERY word you typed exists somewhere in the title
              const isMatch = queryTerms.length === 0 || queryTerms.every(term => text.includes(term));
              item.style.display = isMatch ? "block" : "none";
          });
      });
  });
  </script>
