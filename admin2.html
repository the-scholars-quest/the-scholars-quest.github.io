<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width">
    <title>The Scholar - Personal Uplink</title>
    <style>
        body { 
            background-color: rgb(25, 50, 75); 
            margin: 0; 
            padding: 20px; 
            font-family: sans-serif;
        }
        .admin-box {
            background-color: rgba(0, 12, 23, 0.95);
            border: 2px solid rgb(219, 165, 27);
            padding: 30px; 
            max-width: 600px; 
            margin: 40px auto;
            text-align: left; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .admin-box h2 { color: rgb(219, 165, 27); text-align: center; border-bottom: 1px solid gray; padding-bottom: 10px;}
        .admin-group { margin-bottom: 15px; }
        .admin-group label { display: block; color: white; margin-bottom: 5px; }
        .admin-group input, .admin-group select {
            width: 100%; padding: 12px; background: rgb(0, 12, 23); color: white; 
            border: 1px solid black; box-sizing: border-box; font-family: sans-serif; font-size: 16px;
        }
        .admin-btn {
            width: 100%; background: rgb(219, 165, 27); color: black; font-weight: bold;
            font-size: 1.2rem; padding: 15px; border: none; cursor: pointer; margin-top: 10px;
        }
        .admin-btn:hover { background: white; }
        #statusConsole { margin-top: 20px; padding: 10px; background: black; color: #0f0; font-family: monospace; display: none; white-space: pre-wrap; }
    </style>
</head>
<body>

<div class="admin-box">
    <h2>PERSONAL UPLINK</h2>
    
    <div class="admin-group">
        <label>Auth Token (Password):</label>
        <input type="password" id="ghToken" placeholder="ghp_...">
    </div>

    <div class="admin-group">
        <label>Target Page:</label>
        <select id="targetPage">
            <option value="movies.html">Movies</option>
            <option value="shows.html">Shows</option>
            <option value="books.html">Books</option>
            <option value="comics.html">Comics</option>
        </select>
    </div>

    <div class="admin-group">
        <label>New Entry (e.g. "The Matrix, by Wachowskis"):</label>
        <input type="text" id="entryContent" placeholder="Enter title...">
    </div>

    <button class="admin-btn" onclick="submitPersonalEntry()">INJECT ENTRY</button>

    <div id="statusConsole"></div>
</div>

<script>
const GITHUB_USER = "the-scholars-quest"; 
const REPO_NAME = "the-scholars-quest.github.io";         

function utoa(str) {
    const bytes = new TextEncoder().encode(str);
    let binary = '';
    for (let i = 0; i < bytes.byteLength; i++) { binary += String.fromCharCode(bytes[i]); }
    return btoa(binary);
}

function atou(b64) {
    const binary = atob(b64.replace(/\s/g, ''));
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
    return new TextDecoder().decode(bytes);
}

const log = (msg) => {
    const consoleEl = document.getElementById("statusConsole");
    consoleEl.style.display = "block";
    consoleEl.innerText += msg + "\n";
};

async function getFileSafely(token, path) {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`, { headers: { "Authorization": `token ${token}` } });
    if (!res.ok) throw new Error(`Failed to read metadata for ${path}`);
    const fileData = await res.json();
    
    let text = "";
    if (fileData.content && fileData.content.trim() !== "") {
        text = atou(fileData.content);
    } else {
        const blobRes = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/git/blobs/${fileData.sha}`, { headers: { "Authorization": `token ${token}` } });
        const blobData = await blobRes.json();
        text = atou(blobData.content);
    }
    return { text, sha: fileData.sha };
}

async function updateGitHubFile(token, path, content, sha, message) {
    const res = await fetch(`https://api.github.com/repos/${GITHUB_USER}/${REPO_NAME}/contents/${path}`, {
        method: "PUT",
        headers: { "Authorization": `token ${token}`, "Content-Type": "application/json" },
        body: JSON.stringify({ message: message, content: utoa(content), sha: sha })
    });
    if (!res.ok) throw new Error(`Failed to save ${path}.`);
}

async function submitPersonalEntry() {
    const token = document.getElementById("ghToken").value.trim();
    const page = document.getElementById("targetPage").value;
    const content = document.getElementById("entryContent").value.trim();

    if (!token || !content) { alert("Password and Content are required!"); return; }

    document.getElementById("statusConsole").innerText = "";
    log(`>> Initiating Personal Uplink to ${page}...`);

    try {
        // TARGET PATH FIXED (REMOVED index/)
        const targetPath = `${page}`; 
        const fileData = await getFileSafely(token, targetPath);
        let htmlText = fileData.text;
        
        const injectionAnchor = '<div class="dense-grid" id="mediaList">';
        
        if (!htmlText.includes(injectionAnchor)) {
            throw new Error(`Could not find '<div class="dense-grid" id="mediaList">' in ${page}. Did you wrap your entries in the div?`);
        }

        const newHtml = `\n            <p>${content}</p>`;
        htmlText = htmlText.replace(injectionAnchor, injectionAnchor + newHtml);
        
        await updateGitHubFile(token, targetPath, htmlText, fileData.sha, `Admin2: Added entry to ${page}`);

        log(">> UPLINK COMPLETE! Item injected at the top-left of the grid.");
        document.getElementById("entryContent").value = "";
        
    } catch (err) {
        log(`>> ERROR: ${err.message}`);
    }
}
</script>
</body>
</html>
